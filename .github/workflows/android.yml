name: Build OMR Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Firebase
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || {
            echo "Add VITE_FIREBASE_API_KEY repository secret first."
            exit 1
          }
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || {
            echo "Add VITE_FIREBASE_AUTH_DOMAIN repository secret first."
            exit 1
          }
          test -n "$VITE_FIREBASE_PROJECT_ID" || {
            echo "Add VITE_FIREBASE_PROJECT_ID repository secret first."
            exit 1
          }
          test -n "$VITE_FIREBASE_APP_ID" || {
            echo "Add VITE_FIREBASE_APP_ID repository secret first."
            exit 1
          }
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY" > .env.local
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$VITE_FIREBASE_AUTH_DOMAIN" >> .env.local
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$VITE_FIREBASE_PROJECT_ID" >> .env.local
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID" >> .env.local

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Create Android project if absent
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: omr-debug-apk
          path: android/app/build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error